---
# Deploy the runtime tarball to every instance, write the systemd unit and
# config, and start the services (load/verify are installed but not started;
# run them with run-load.yml / run-verify.yml).
- name: Distribute justrade runtime
  hosts: all
  become: true
  tags:
    - distribute
  tasks:
    - name: Ensure install dir exists
      ansible.builtin.file:
        path: "{{ install_dir }}"
        state: directory

    - name: Upload runtime tarball
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../justrade-runtime.tgz"
        dest: /tmp/justrade-runtime.tgz

    - name: Extract runtime tarball
      ansible.builtin.unarchive:
        src: /tmp/justrade-runtime.tgz
        dest: "{{ install_dir }}"
        remote_src: true

- name: Configure and start services
  hosts: all
  become: true
  tags:
    - configure
  tasks:
    - name: Create gateway config directory
      ansible.builtin.file:
        path: /etc/justrade
        state: directory
      when: inventory_hostname in groups['gateway']

    - name: Write gateway.properties
      ansible.builtin.template:
        src: gateway.properties.j2
        dest: "{{ gateway_config_path }}"
      when: inventory_hostname in groups['gateway']

    - name: Raise OS socket buffer limits for Aeron
      ansible.builtin.copy:
        content: |
          # 16 MB Aeron socket buffers (SO_RCVBUF doubles, so rmem_max allows 32 MB).
          net.core.rmem_max = 33554432
          net.core.wmem_max = 33554432
        dest: /etc/sysctl.d/99-justrade.conf
        mode: "0644"

    - name: Apply socket buffer limits
      ansible.builtin.shell:
        cmd: sysctl -p /etc/sysctl.d/99-justrade.conf

    - name: Install systemd unit
      ansible.builtin.template:
        src: justrade.service.j2
        dest: /etc/systemd/system/justrade.service

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start service
      ansible.builtin.systemd:
        name: justrade
        enabled: "{{ service_enable | default(false) }}"
        state: started
      when: service_enable | default(false)
