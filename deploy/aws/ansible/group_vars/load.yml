---
svc_name: "excoredum write-side load"
service_type: oneshot
service_enable: false
service_exec: "{{ install_dir }}/bin/load.sh"
service_env:
  EXC_ENDPOINTS: "{{ ingress_endpoints }}"
  EXC_OPS: "{{ workload_ops }}"
  EXC_USERS: "{{ workload_users }}"
  EXC_SYMBOLS: "{{ workload_symbols }}"
  EXC_BATCH: "{{ load_batch }}"
  EXC_CLIENT_ID: "{{ load_client_id }}"
  EXC_JAVA_OPTS: "{{ load_java_opts }}"
