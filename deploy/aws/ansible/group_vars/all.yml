---
# Shared deployment defaults. Addressing strings (cluster_members,
# ingress_endpoints, archive_channels, query_channel) are generated by
# inventory.sh into hosts.ini [all:vars], not here.

base_dir: /data
install_dir: /opt/justrade
clean_start: "true"
metrics_interval_ms: "5000"

workload_ops: "5000000"
workload_users: "5000"
workload_symbols: "256"
workload_trade_limit: "4096"
load_client_id: "1"
# Write-side in-flight drain batch (power of two). Higher deepens the pipeline
# and raises throughput, at the cost of more ingress backpressure.
load_batch: "64"

# Tuning knobs for the JVM and the engine / ledger capacities. An empty value
# means "use the compiled-in default" (the bin scripts fall back when the env
# var is empty or unset). The JUSTRADE_CORE_* engine capacities follow the same
# convention (e.g. JUSTRADE_CORE_SYMBOL_CAPACITY, JUSTRADE_CORE_ORDER_POOL_CAPACITY,
# JUSTRADE_CORE_JOURNAL_SLOT_COUNT); add them to nodes.yml / read.yml service_env
# when a run needs to raise them.
node_java_opts: "-Xms4g -Xmx4g -XX:+UseZGC"
read_java_opts: "-Xms4g -Xmx4g -XX:+UseZGC"
gateway_java_opts: ""
load_java_opts: ""
verify_java_opts: ""
aeron_term_length: "1m"
ledger_max_orders_per_user: ""
ledger_max_market_trades: "2097152"

# The gateway declares one symbol per workload symbol (id|name|base|quote|
# baseScaleK|quoteScaleK|makerFee|takerFee), generated from workload_symbols in
# gateway.properties.j2 so the gateway registry matches the benchmark symbol count.
gateway_currencies: "10|BTC|1,20|USDT|1"

gateway_bench_ops: "10000"
gateway_bench_users: "100"
gateway_bench_admin_uid: "811"
