---
svc_name: "justrade read-side verification"
service_type: oneshot
service_enable: false
service_exec: "{{ install_dir }}/bin/verify.sh"
service_env:
  JUSTRADE_QUERY: "{{ query_channel }}"
  JUSTRADE_OPS: "{{ workload_ops }}"
  JUSTRADE_USERS: "{{ workload_users }}"
  JUSTRADE_SYMBOLS: "{{ workload_symbols }}"
  JUSTRADE_TRADE_LIMIT: "{{ workload_trade_limit }}"
  JUSTRADE_JAVA_OPTS: "{{ verify_java_opts }}"
