name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless check
        run: ./gradlew spotlessCheck

      - name: Checkstyle (main + test)
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Compile (zero warnings)
        run: ./gradlew compileJava

      - name: Unit + property + integration tests
        run: ./gradlew test integrationTest

      - name: Multi-node cluster tests
        run: |
          attempt=1; max=2
          until ./gradlew clusterTest; do
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::clusterTest failed after $attempt attempts" >&2
              exit 1
            fi
            echo "clusterTest attempt $attempt/$max failed; retrying in 10s" >&2
            attempt=$((attempt + 1))
            sleep 10
          done

      - name: Fault-injection tests
        run: |
          attempt=1; max=2
          until ./gradlew faultTest; do
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::faultTest failed after $attempt attempts" >&2
              exit 1
            fi
            echo "faultTest attempt $attempt/$max failed; retrying in 10s" >&2
            attempt=$((attempt + 1))
            sleep 10
          done

      # Shared CI runners drift in absolute ns/op (host hardware + JDK build),
      # so the timing gate is advisory here. The --gc zero-allocation contract
      # is deterministic and machine-independent, so it stays strict.
      - name: JMH timing regression (advisory on shared runner)
        run: python3 scripts/jmh-regression.py --advisory-timing

      - name: JMH zero-allocation contract (strict)
        run: python3 scripts/jmh-regression.py --gc
