name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless check
        run: ./gradlew spotlessCheck

      - name: Checkstyle (main + test)
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Compile (zero warnings)
        run: ./gradlew compileJava

      - name: Unit + property + integration tests
        run: ./gradlew test integrationTest

      - name: Multi-node cluster + fault tests
        run: ./gradlew clusterTest faultTest

      - name: JMH quick benchmark (regression smoke)
        run: ./gradlew :exc-core:jmh -PquickBench
